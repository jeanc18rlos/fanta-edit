# Checked by `script/gate`: cargo deny --locked check advisories sources bans
# Licences are not checked here; script/check-licenses owns them.

[advisories]
# A vulnerability always fails. cargo-deny has no warn level for
# unmaintained crates, only a scope, so the gate passes `-W unmaintained`.
unmaintained = "all"
yanked = "warn"
# First run, 2026-11-13: 24 vulnerability and 4 unsound advisories in the
# locked tree. Each is tolerated until the named update lands. cargo-deny
# warns when an entry stops matching, which is the cue to delete it.
# "Not called" means by a workspace crate.
ignore = [
    # quick-xml: no longer reachable from project files, still locked.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml: quadratic duplicate-attribute check. Not reachable from project files: fanta-format reads attributes through first_attributes, with the check off. Still locked: 0.38.3 for the workspace (agent only escapes text; the inherited mermaid_render iterates attributes of SVG its own renderer produced), and 0.30, 0.37 and 0.39 through xcb, wayland-scanner and zbus_xml. Removed by quick-xml >= 0.41 in all of them." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml: NsReader allocation; NsReader is not used. Removed by quick-xml >= 0.41." },

    # The affected function is not called.
    { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2: ZipArchive::extract keeps SUID bits. extract is not called; entries are read into memory. Removed by zip >= 9." },
    { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2: extract creates symlinks that point outside the destination; extract is not called. Removed by zip >= 9." },
    { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2: extract applies permissions through symlinks; extract is not called. Removed by zip >= 9." },
    { id = "RUSTSEC-2026-0429", reason = "zip 2.4.2: extract aborts on a symlink entry with a huge declared size; extract is not called. Removed by zip >= 9." },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 5.0.2: write::Decoder exposes memory after a corrupt legacy frame. The .fig reader uses read::Decoder and the other callers decode_all or copy_decode, which are unaffected. Removed by moving the workspace zstd from 0.11 to >= 0.13.4 (agent, crashes, fanta-fig-interop, rpc); the 0.13 line through zip is already patched." },

    # Inherited from Zed; needs local files or a peer that Fanta does not have.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10: Marvin timing attack. The inherited rpc crate uses it to decrypt a collaboration token, a service Fanta does not run. Removed by rsa >= 0.10 or by dropping rpc." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 (bundled SQLite): stale memory from a crafted database and -wal pair; sqlez opens only databases the app wrote. Removed by libsqlite3-sys >= 0.39." },

    # Unsound: memory unsafety needs a panic or a call pattern not found here.
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4: LruCache::pop when a key's Drop panics; the keys are integers and strings. Removed by lru >= 0.18.2." },
    { id = "RUSTSEC-2026-0256", reason = "circular-buffer 1.2.0: truncate and clear when an element's Drop panics; used by the inherited debugger session only. Removed by circular-buffer >= 2.0.1." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The git sources Cargo.lock pins. A new one needs a line here.
allow-git = [
    "https://github.com/RustAudio/rodio",
    "https://github.com/camdencheek/tree-sitter-go-mod",
    "https://github.com/microsoft/python-environment-tools.git",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/squidred-dev/fanta-ui.git",
    "https://github.com/tree-sitter-grammars/tree-sitter-markdown",
    "https://github.com/tree-sitter/tree-sitter-cpp",
    "https://github.com/zed-industries/alacritty",
    "https://github.com/zed-industries/async-pipe-rs",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/dap-types",
    "https://github.com/zed-industries/lsp-types",
    "https://github.com/zed-industries/merman",
    "https://github.com/zed-industries/notify",
    "https://github.com/zed-industries/trash-rs",
    "https://github.com/zed-industries/tree-sitter-git-commit",
    "https://github.com/zed-industries/tree-sitter-go-work",
    "https://github.com/zed-industries/tree-sitter-heex",
    "https://github.com/zed-industries/tree-sitter-typescript",
    "https://github.com/zed-industries/tree-sitter-yaml",
    "https://github.com/zed-industries/windows-capture.git",
    "https://github.com/zed-industries/wprcontrol",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
