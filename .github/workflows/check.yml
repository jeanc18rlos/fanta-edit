name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      native_video_only:
        description: Run the native video diagnostics without unrelated checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.native_video_only && 'native-video' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check

      - name: Check licenses
        run: ./script/check-licenses

      - name: Check release scripts
        run: bash -n script/bundle-mac script/bundle-git script/verify-bundled-git script/generate-licenses script/verify-macos-document-icon

      - name: Check the app and command line tool build
        run: cargo check --locked -p zed -p cli

      - name: Test document snapshots and file compatibility
        run: |
          cargo test --locked -p fanta-doc -p fanta-format
          cargo test --locked -p fanta-fnx -p fanta-format --lib --features serde_json/preserve_order

      - name: Test canvas editing tools
        run: cargo test --locked -p fanta-tools --lib

      - name: Test canvas rendering, clipping, effects and live video
        run: cargo test --locked -p fanta-render --lib

      - name: Test Git sync without a system installation
        run: cargo test --locked -p git --lib bundled_git_

      - name: Test languages used by designs and Git commit messages
        run: cargo test --locked -p fanta_languages --lib

      - name: Test AI provider authentication
        run: cargo test --locked -p language_model -p language_models --lib

      - name: Test browser sign-in recovery
        run: cargo test --locked -p client --lib test_browser_sign_in

      - name: Test Fanta media server account lifecycle
        run: cargo test --locked -p project --lib --test integration test_fanta_mcp

      - name: Test the full native editor suite
        run: cargo test --locked -p fig_viewer --lib

      - name: Test native video previews, playback and cleanup
        run: |
          cargo test --locked -p media --lib
          cargo test --locked -p media --test video_playback

      - name: Test Save As path prompts
        run: cargo test --locked -p open_path_prompt --lib save_as_

      - name: Test macOS font ownership and selection
        run: |
          cargo test --locked -p gpui_macos --features font-kit --lib text_system::tests
          cargo test --locked -p gpui_macos --features font-kit --lib open_type::tests

      - name: Test the agent panel toggle
        run: cargo test --locked -p agent_ui --lib test_toggle_closes_visible_agent_panel_when_center_pane_has_focus

      - name: Test sidebar behavior and project ownership
        run: cargo test --locked -p sidebar --lib

      - name: Test canvas toolbar interactions
        run: cargo test --locked -p fanta-gpui --lib organisms::toolbar::component::interaction_tests

  native-video:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check
      - name: Test native video library
        id: native-library
        run: cargo test --locked -p media --lib
      - name: Test native video with bounded seek diagnostics
        env:
          FANTA_VIDEO_SEEK_TRACE: '1'
        run: cargo test --locked -p media --test video_playback
      - name: Test native video without diagnostic timing overhead
        if: ${{ !cancelled() && steps.native-library.outcome == 'success' }}
        run: cargo test --locked -p media --test video_playback
