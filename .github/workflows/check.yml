name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      native_video_only:
        description: Run the native video diagnostics without unrelated checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.native_video_only && 'native-video' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check

      - name: Check licenses
        run: ./script/check-licenses

      - name: Check release scripts
        run: bash -n script/bundle-mac script/bundle-git script/verify-bundled-git script/generate-licenses script/verify-macos-document-icon script/verify-fanta-release

      - name: Test macOS packaging preflight and artifact checks
        shell: bash
        run: |
          python3 script/test-macos-release \
            --report "${RUNNER_TEMP}/macos-packaging-regressions.json" \
            2>&1 | tee "${RUNNER_TEMP}/macos-packaging-regressions.log"

      - name: Check the app and command line tool build
        run: cargo check --locked -p zed -p cli

      - name: Test design engines, import, editor interactions and UI components
        run: |
          ./script/verify-fanta-release \
            --stage engine --stage import --stage source-order --stage editor --stage workspace --stage ui \
            --output-dir "${RUNNER_TEMP}/fanta-release-verification"

      - name: Preserve release verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fanta-release-verification
            ${{ runner.temp }}/macos-packaging-regressions.json
            ${{ runner.temp }}/macos-packaging-regressions.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Test Git sync without a system installation
        run: cargo test --locked -p git --lib bundled_git_

      - name: Test languages used by designs and Git commit messages
        run: cargo test --locked -p fanta_languages --lib

      - name: Test AI provider authentication
        run: cargo test --locked -p language_model -p language_models --lib

      - name: Test browser sign-in recovery
        run: cargo test --locked -p client --lib test_browser_sign_in

      - name: Test Fanta media server account lifecycle
        run: cargo test --locked -p project --lib --test integration test_fanta_mcp

      - name: Test Save As path prompts
        run: cargo test --locked -p open_path_prompt --lib save_as_

      - name: Test the agent panel toggle
        run: cargo test --locked -p agent_ui --lib test_toggle_closes_visible_agent_panel_when_center_pane_has_focus

      - name: Test sidebar behavior and project ownership
        run: cargo test --locked -p sidebar --lib

  mac-app-store-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check

      - name: Check the Mac App Store feature build
        run: cargo check --locked -p zed --features mac_app_store

      - name: Test Store App Access settings guide
        run: cargo test --locked -p zed --bin fanta --features mac_app_store store_app_access_guide_has_one_system_action_and_three_explanations

      - name: Test Store Welcome App Access entry
        run: cargo test --locked -p workspace --lib --features mac_app_store store_welcome_links_to_app_access_guide

      - name: Test blocked local MCP process spawn
        run: cargo test --locked -p context_server --lib --features mac_app_store rejects_stdio_before_process_spawn

      - name: Test blocked native agent terminal commands
        run: cargo test --locked -p agent --lib --features mac_app_store test_mac_app_store_terminal_tool

      - name: Test terminal action is hidden in Store builds
        run: cargo test --locked -p agent_ui --lib --features mac_app_store test_agent_command_palette_visibility

      - name: Test blocked direct ACP process spawn
        run: cargo test --locked -p agent_servers --lib --features mac_app_store test_mac_app_store_blocks_direct_acp_stdio_spawn

      - name: Test blocked Prettier JavaScript server
        run: cargo test --locked -p prettier --lib --features mac_app_store test_mac_app_store_rejects_prettier_launch

      - name: Test blocked remote connections
        run: cargo test --locked -p remote --lib --features mac_app_store test_mac_app_store_rejects_remote_connection

      - name: Test bundled Git requirement
        run: cargo test --locked -p fs --test integration --features mac_app_store,test-support test_mac_app_store_requires_bundled_git

      - name: Test blocked project execution paths
        run: cargo test --locked -p project --test integration --features mac_app_store,test-support test_mac_app_store_

  native-video:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Test canvas video rendering
        id: native-library
        run: cargo test --locked -p fanta-render --lib live_video_
      - name: Test editor video playback with seek diagnostics
        env:
          FANTA_VIDEO_SEEK_TRACE: '1'
        run: cargo test --locked -p fig_viewer --lib video_playback::tests
      - name: Test editor video playback without diagnostic timing overhead
        if: ${{ !cancelled() && steps.native-library.outcome == 'success' }}
        run: cargo test --locked -p fig_viewer --lib video_playback::tests
