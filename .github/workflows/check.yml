name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check

      - name: Check licenses
        run: ./script/check-licenses

      - name: Check release scripts
        run: bash -n script/bundle-mac script/bundle-git script/verify-bundled-git script/generate-licenses script/verify-macos-document-icon

      - name: Check the app and command line tool build
        run: cargo check --locked -p zed -p cli

      - name: Test document snapshots and file compatibility
        run: cargo test --locked -p fanta-doc -p fanta-format

      - name: Test Git sync without a system installation
        run: cargo test --locked -p git --lib bundled_git_

      - name: Test languages used by designs and Git commit messages
        run: cargo test --locked -p fanta_languages --lib

      - name: Test AI provider authentication
        run: cargo test --locked -p language_model -p language_models --lib

      - name: Test browser sign-in recovery
        run: cargo test --locked -p client --lib test_browser_sign_in

      - name: Test Fanta media server account lifecycle
        run: cargo test --locked -p project --lib --test integration test_fanta_mcp

      - name: Test native media generation and document lifecycle
        run: |
          cargo test --locked -p fig_viewer --lib generation_
          cargo test --locked -p fig_viewer --lib document::tests
          cargo test --locked -p fig_viewer --lib switching_pages_clears_the_inspected_selection_but_reselecting_a_page_keeps_it

      - name: Test the agent panel toggle
        run: cargo test --locked -p agent_ui --lib test_toggle_closes_visible_agent_panel_when_center_pane_has_focus

      - name: Test closed project ownership
        run: |
          cargo test --locked -p sidebar --lib closing_a_project_releases_its_workspace
          cargo test --locked -p sidebar --lib adding_a_ready_agent_panel_synchronizes_the_current_sidebar_selection
          cargo test --locked -p sidebar --lib creating_a_sidebar_synchronizes_an_existing_agent_panel
          cargo test --locked -p sidebar --lib property_test::test_sidebar_invariants

      - name: Test canvas toolbar text entry
        run: |
          cargo test --locked -p fanta-gpui --lib organisms::toolbar::component::interaction_tests
          cargo test --locked -p fig_viewer --lib toolbar_actions_query_keeps_text_input_with_canvas_keybindings
