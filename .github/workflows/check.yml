name: Check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check licenses
        run: ./script/check-licenses

      - name: Check the app builds
        run: cargo check --locked -p zed

      - name: Test published component icon assets
        run: cargo test --locked -p fig_viewer --lib every_gpui_component_icon_resolves_in_the_app_asset_source
