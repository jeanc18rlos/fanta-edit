name: Check

on:
  # A branch push without a pull request starts nothing: the pull request run covers it.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      native_video_only:
        description: Run the native video diagnostics without unrelated checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.native_video_only && 'native-video' || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  # Classifies the diff so that jobs skip instead of the workflow not starting.
  changes:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_video_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      rust: ${{ steps.classify.outputs.rust }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base.
          fetch-depth: 2

      - name: Classify the changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          docs=false
          rust=false
          workflows=false
          if [[ "$EVENT_NAME" != pull_request ]]; then
            # shortcut: pushes to main and manual runs test everything; classify them when main runs become the bottleneck.
            rust=true
          else
            while IFS= read -r path; do
              case "$path" in
                # crates/fanta-format includes this file with include_str!.
                docs/fanta/project-schema.md) rust=true ;;
                .github/*) workflows=true ;;
                docs/*|specs/*|.agents/*|.claude/*|.rules) docs=true ;;
                */*) rust=true ;;
                *.md) docs=true ;;
                *) rust=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          printf 'docs=%s\nrust=%s\nworkflows=%s\n' "$docs" "$rust" "$workflows" | tee -a "$GITHUB_OUTPUT"

  # Everything that needs no compile. Runs on every pull request, drafts and docs-only included.
  hygiene:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_video_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # `cargo metadata` and cargo-deny read manifests and Cargo.lock only, so the
      # runner's stable toolchain is enough and the pinned one need not install.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # cargo-deny has cargo download every locked crate to read its manifest:
      # three minutes without this cache. No target directory: nothing compiles.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: hygiene
          cache-targets: 'false'
          save-if: 'true'

      - name: Install typos, zizmor and cargo-deny
        run: script/install-gate-tools "${RUNNER_TEMP}/gate-tools"

      # CI is set, so a missing tool fails instead of skipping.
      - name: Run the checks that need no compile
        run: PATH="${RUNNER_TEMP}/gate-tools:${PATH}" script/gate

  # Advisory until five consecutive green runs on main (spec 0012, T2).
  linux-test:
    needs: changes
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') }}
    continue-on-error: true
    # Skia's PDF backend needs C++20 ranges that Ubuntu 22.04's libstdc++ 12 lacks under
    # clang; the runtime and engine image workflows build Skia on 24.04 for the same reason.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Debug test binaries plus one release lint build outgrow the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.95.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: $/.github/actions/prepare-skia-source
        with:
          offline: 'true'

      # The render stage (golden image) and the editor stage stay on macOS.
      - name: Test the platform-independent stages
        run: |
          ./script/verify-fanta-release \
            --stage engine --stage import --stage source-order --stage workspace --stage ui \
            --stage shell --stage release-blockers \
            --output-dir "${RUNNER_TEMP}/fanta-release-verification"

      - name: Preserve release verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fanta-release-verification
          if-no-files-found: ignore
          retention-days: 14

  check:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.native_video_only) && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: $/.github/actions/prepare-skia-source
        with:
          offline: 'true'

      - name: Check licenses
        run: ./script/check-licenses

      - name: Check release scripts
        run: bash -n script/bundle-mac script/bundle-git script/verify-bundled-git script/generate-licenses script/verify-macos-document-icon script/verify-fanta-release

      - name: Test macOS packaging preflight and artifact checks
        shell: bash
        run: |
          python3 script/test-macos-release \
            --report "${RUNNER_TEMP}/macos-packaging-regressions.json" \
            2>&1 | tee "${RUNNER_TEMP}/macos-packaging-regressions.log"

      - name: Check the app and command line tool build
        run: cargo check --locked -p fanta -p cli

      - name: Check the browser wasm engine builds
        run: |
          rustup target add wasm32-unknown-unknown
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' \
            cargo check --locked -p fanta-wasm-engine --target wasm32-unknown-unknown

      - name: Test design engines, import, editor interactions and UI components
        run: |
          ./script/verify-fanta-release \
            --stage engine --stage render --stage import --stage source-order --stage editor --stage workspace --stage ui \
            --output-dir "${RUNNER_TEMP}/fanta-release-verification"

      - name: Verify every required editor and workspace regression actually passed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PYCORE'
          import csv, json, os, re
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "fanta-release-verification"
          output.mkdir(parents=True, exist_ok=True)
          expected = {
              "editor": [
                  "property_draft_explicit_save_commits_focused_input",
                  "property_draft_invalid_save_preserves_then_corrects_input",
                  "property_draft_window_save_commits_after_prompt_focus",
                  "property_draft_invalid_window_save_keeps_discard_available",
                  "property_draft_window_cancel_then_discard_preserves_shared_item",
                  "property_draft_invalid_window_cancel_then_discard",
                  "property_draft_unchanged_focused_field_closes_without_prompt",
                  "property_draft_shared_save_all_commits_later_pane_owner_first",
                  "property_draft_invalid_shared_save_all_keeps_discard_available",
                  "unchanged_failed_autosave_stays_dirty_without_repeated_writes",
                  "explicit_save_retries_the_unchanged_failed_autosave",
                  "new_edit_retries_after_an_autosave_failure",
                  "newer_edit_during_failed_autosave_remains_eligible",
                  "queued_identical_autosave_is_suppressed_after_the_first_failure",
                  "mounted_native_figview_save_closes_multi_workspace_window",
                  "mounted_native_figview_discard_closes_multi_workspace_window",
                  "mounted_native_figview_autosave_during_prompt_then_save_closes_window",
                  "mounted_design_crop_context_menu_controls_preserve_cancelled_document",
                  "mounted_design_crop_double_click_controls_preserve_cancelled_document",
                  "mounted_design_crop_apply_button_commits_once_and_roundtrips_history",
                  "draw_region_survives_tool_switch_and_masks_crop",
                  "source_recovery_canvas_tab_restores_save_keyboard_route",
                  "save_failure_notice_real_write_error_is_concise_and_recovery_is_scoped",
                  "save_failure_notice_discard_removes_only_the_closed_document",
                  "save_failure_notice_survives_one_shared_tab_until_the_last_removal",
                  "save_failure_notice_deferred_show_cannot_outlive_save_or_removal",
                  "pane_layout_reserves_canvas_without_changing_hidden_panel_preferences",
                  "pane_layout_measures_the_pane_and_restores_wide_sidebars",
                  "pane_layout_preserves_valid_property_input_across_compaction",
                  "pane_layout_preserves_invalid_property_input_across_compaction",
                  "audio_preview_completed_player_reaches_known_duration",
                  "audio_preview_paused_and_seeked_player_keeps_incomplete_position",
                  "audio_preview_close_resets_completed_position",
                  "mounted_canvas_toolbar_fits_narrow_panes_and_scrolls_without_panning",
                  "mounted_canvas_crop_controls_fit_240_and_preserve_cancel_apply_history",
                  "mounted_canvas_crop_controls_fit_256_and_preserve_cancel_apply_history",
                  "mounted_canvas_crop_controls_fit_336_and_preserve_cancel_apply_history",
                  "canvas_session_explicit_manifest_reuses_workspace_and_closed_tab",
                  "canvas_session_empty_restore_allows_only_newly_added_project_auto_open",
                  "canvas_session_legacy_manifest_root_restores_once_then_keeps_empty_layout",
                  "canvas_session_manifest_normalization_preserves_ordinary_and_malformed_files",
                  "canvas_session_explicit_reused_open_survives_later_manifest_read_failure",
                  "rounded_ancestor_clips_filter_physical_authoring_hits",
                  "rounded_ancestor_vector_fallback_preserves_tolerance_and_visible_candidates",
                  "mounted_physical_leaf_entry_respects_rounded_ancestor_clips",
                  "text_path_position_matches_visual_bounds_and_undo_under_transformed_parent"
              ],
              "workspace": [
                  "test_close_window_reports_save_failure_and_retries",
                  "test_close_window_reports_save_failure_and_can_discard",
                  "test_multi_workspace_close_window_multiple_workspaces_cancel",
                  "canvas_session_captured_manifest_identity_survives_later_read_failure",
                  "test_save_all_reports_failure_preserves_remaining_drafts_and_retries"
              ]
          }
          required_stages = ("engine", "render", "import", "source-order", "editor", "workspace", "ui")
          stage_path = output / "results.tsv"
          stages = []
          if stage_path.exists():
              with stage_path.open() as stream:
                  stages = list(csv.DictReader(stream, delimiter="\t"))
          stage_checks = {}
          for stage in required_stages:
              rows = [row for row in stages if row.get("stage") == stage]
              stage_checks[stage] = len(rows) == 1 and rows[0].get("result") == "PASS" and rows[0].get("exit_code") == "0"
          checks = {}
          for label, names in expected.items():
              path = output / (label + ".log")
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", path.read_text(errors="replace")) if path.exists() else ""
              tests = re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)(?:,.*)?$", text, re.MULTILINE)
              checks[label] = {}
              for name in names:
                  actual = [(full_name, status) for full_name, status in tests if full_name.rsplit("::", 1)[-1] == name]
                  checks[label][name] = {"actual": actual, "passed": len(actual) == 1 and actual[0][1] == "ok"}
          passed = all(stage_checks.values()) and all(result["passed"] for group in checks.values() for result in group.values())
          report = {"passed": passed, "required_count": 51, "stages": stage_checks, "groups": checks,
                    "scope": "Actual full-suite offline editor/workspace execution; the separate30 Agent/ACP/Settings gate remains required. No native, GPU, service or performance acceptance."}
          (output / "required-core-regressions.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          if not passed:
              raise SystemExit("Required core regressions or release verification stages did not all pass")
          PYCORE

      - name: Preserve release verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fanta-release-verification
            ${{ runner.temp }}/macos-packaging-regressions.json
            ${{ runner.temp }}/macos-packaging-regressions.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Test Git sync without a system installation
        run: cargo test --locked -p git --lib bundled_git_

      - name: Test languages used by designs and Git commit messages
        run: cargo test --locked -p fanta_languages --lib

      - name: Test AI provider authentication
        run: cargo test --locked -p language_model -p language_models --lib

      - name: Test browser sign-in recovery
        run: cargo test --locked -p client --lib test_browser_sign_in

      - name: Test Fanta media server account lifecycle
        run: cargo test --locked -p project --lib --test integration test_fanta_mcp

      - name: Test Save As path prompts
        run: cargo test --locked -p open_path_prompt --lib save_as_

      # ADR 0017 relies on these: update signatures, the signer's test vector
      # and version ordering.
      - name: Test update verification
        run: cargo test --locked -p auto_update --lib

      - name: Test the agent panel toggle
        run: cargo test --locked -p agent_ui --lib test_toggle_closes_visible_agent_panel_when_center_pane_has_focus

      - name: Test design prompt preparation
        run: |
          cargo test --locked -p agent --lib test_fanta_specs
          cargo test --locked -p agent --lib test_design_progress

      - name: Test design source validation and saves
        run: cargo test --locked -p fanta-bundle -p fanta-fnx -p fanta-format --lib

      - name: Check the hostile-edit corpus
        run: cargo test --locked -p fanta-format --test check_corpus

      - name: Keep the editor and the renderer out of the project checker
        run: |
          if cargo tree --locked -p fanta-format -e normal --prefix none | grep -E '^(gpui|skia-safe|skia-bindings|fig_viewer) '; then
            echo 'fanta-check must build without GPUI, Skia or the editor (spec 0009 R9)' >&2
            exit 1
          fi

      - name: Test sidebar behavior and project ownership
        run: cargo test --locked -p sidebar --lib

  mac-app-store-runtime:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.native_video_only) && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check
          # The check job's build is the superset, and three saved copies would not fit the 10 GB cache limit.
          save-if: 'false'

      - uses: $/.github/actions/prepare-skia-source
        with:
          offline: 'true'

      - name: Check the Mac App Store feature build
        run: cargo check --locked -p fanta --features mac_app_store

      - name: Test Store App Access settings guide
        run: cargo test --locked -p fanta --bin fanta --features mac_app_store store_app_access_guide_has_one_system_action_and_three_explanations

      - name: Test account billing date windows
        run: cargo test --locked -p fanta --bin fanta --features mac_app_store usage_

      - name: Test Store Welcome App Access entry
        run: cargo test --locked -p workspace --lib --features mac_app_store store_welcome_links_to_app_access_guide

      - name: Test blocked local MCP process spawn
        run: cargo test --locked -p context_server --lib --features mac_app_store rejects_stdio_before_process_spawn

      - name: Test blocked native agent terminal commands
        run: cargo test --locked -p agent --lib --features mac_app_store test_mac_app_store_terminal_tool

      - name: Test terminal action is hidden in Store builds
        run: cargo test --locked -p agent_ui --lib --features mac_app_store test_agent_command_palette_visibility

      - name: Test blocked direct ACP process spawn
        run: cargo test --locked -p agent_servers --lib --features mac_app_store test_mac_app_store_blocks_direct_acp_stdio_spawn

      - name: Test blocked Prettier JavaScript server
        run: cargo test --locked -p prettier --lib --features mac_app_store test_mac_app_store_rejects_prettier_launch

      - name: Test blocked remote connections
        run: cargo test --locked -p remote --lib --features mac_app_store test_mac_app_store_rejects_remote_connection

      - name: Test bundled Git requirement
        run: cargo test --locked -p fs --test integration --features mac_app_store,test-support test_mac_app_store_requires_bundled_git

      - name: Test blocked project execution paths
        run: cargo test --locked -p project --test integration --features mac_app_store,test-support test_mac_app_store_

  release-blocker-regressions:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.native_video_only) && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare release blocker evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          mkdir -p "$evidence/config"
          git show -s --format=raw HEAD > "$evidence/checkout.txt"
          git rev-parse HEAD HEAD^{tree} > "$evidence/checkout-identity.txt"
          python3 - "$evidence" <<'PYCONFIG'
          import hashlib, json, pathlib, subprocess, sys
          output = pathlib.Path(sys.argv[1])
          configuration = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/check.yml", "script/clippy", "crates/agent/Cargo.toml", "crates/acp_thread/Cargo.toml", "crates/language_model/Cargo.toml", "crates/fanta/Cargo.toml"]
          sources = ["crates/agent/src/thread.rs", "crates/acp_thread/src/acp_thread.rs", "crates/language_model/src/fake_provider.rs", "crates/fanta/src/fanta/settings_modal.rs"]
          records = []
          for name in configuration + sources:
              path = pathlib.Path(name)
              data = path.read_bytes()
              records.append({"path": name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "blob": subprocess.check_output(["git", "rev-parse", "HEAD:" + name], text=True).strip()})
              if name in configuration:
                  target = output / "config" / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          (output / "source-bindings.json").write_text(json.dumps(records, indent=2) + "\n")
          PYCONFIG
          printf 'Default-feature tests; no mac_app_store or --all-features. Test profile is debug; script/clippy uses release/all-targets/deny-warnings.\n' > "$evidence/scope.txt"
          : > "$evidence/results.tsv"

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain 2>&1 | tee "${RUNNER_TEMP}/release-blocker-regressions/toolchain.log"
          rustc --version --verbose 2>&1 | tee -a "${RUNNER_TEMP}/release-blocker-regressions/toolchain.log"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-check
          # The check job's build is the superset, and three saved copies would not fit the 10 GB cache limit.
          save-if: 'false'

      - uses: $/.github/actions/prepare-skia-source
        with:
          offline: 'true'

      - name: Test native Agent request limits
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p agent --lib test_turn_request_budget_' > "$evidence/agent.command.txt"
          set +e
          cargo test --locked -p agent --lib test_turn_request_budget_ 2>&1 | tee "$evidence/agent.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'agent\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test ACP request-limit completion
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p acp_thread --lib test_turn_request_budget_' > "$evidence/acp-thread.command.txt"
          set +e
          cargo test --locked -p acp_thread --lib test_turn_request_budget_ 2>&1 | tee "$evidence/acp-thread.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'acp-thread\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test direct-download Settings keyboard closure
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p fanta --bin fanta settings_window_' > "$evidence/settings-window.command.txt"
          set +e
          cargo test --locked -p fanta --bin fanta settings_window_ 2>&1 | tee "$evidence/settings-window.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'settings-window\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test existing output-limit regressions
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p agent --lib test_output_limit_' > "$evidence/output-limit.command.txt"
          set +e
          cargo test --locked -p agent --lib test_output_limit_ 2>&1 | tee "$evidence/output-limit.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'output-limit\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test existing compaction regressions
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p agent --lib test_compaction_' > "$evidence/compaction.command.txt"
          set +e
          cargo test --locked -p agent --lib test_compaction_ 2>&1 | tee "$evidence/compaction.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'compaction\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test existing manual-compaction-cancel regressions
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p agent --lib test_manual_compact_cancelled_leaves_no_marker' > "$evidence/manual-compaction-cancel.command.txt"
          set +e
          cargo test --locked -p agent --lib test_manual_compact_cancelled_leaves_no_marker 2>&1 | tee "$evidence/manual-compaction-cancel.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'manual-compaction-cancel\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test existing acp-stale-cancel regressions
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p acp_thread --lib test_stale_cancelled_response_does_not_cancel_current_compaction' > "$evidence/acp-stale-cancel.command.txt"
          set +e
          cargo test --locked -p acp_thread --lib test_stale_cancelled_response_does_not_cancel_current_compaction 2>&1 | tee "$evidence/acp-stale-cancel.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'acp-stale-cancel\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Test existing acp-max-tokens regressions
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'cargo test --locked -p acp_thread --lib test_max_tokens_cancels_pending_session_elicitation' > "$evidence/acp-max-tokens.command.txt"
          set +e
          cargo test --locked -p acp_thread --lib test_max_tokens_cancels_pending_session_elicitation 2>&1 | tee "$evidence/acp-max-tokens.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'acp-max-tokens\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Lint release blocker crates with default features
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/release-blocker-regressions"
          printf '%s\n' 'FANTA_CLIPPY_DEFAULT_FEATURES=1 ./script/clippy --locked -p agent -p acp_thread -p language_model -p fanta' > "$evidence/default-clippy.command.txt"
          set +e
          FANTA_CLIPPY_DEFAULT_FEATURES=1 ./script/clippy --locked -p agent -p acp_thread -p language_model -p fanta 2>&1 | tee "$evidence/default-clippy.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'default-clippy\t%s\t%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/results.tsv"
          (( statuses[0] == 0 && statuses[1] == 0 ))

      - name: Verify every required regression actually passed
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/release-blocker-regressions" <<'PYRESULTS'
          import json, pathlib, re, sys
          output = pathlib.Path(sys.argv[1])
          expected = {'agent': ['test_turn_request_budget_bounds_tool_rounds_and_resets_for_new_user_turn', 'test_turn_request_budget_survives_retry_and_output_counter_resets', 'test_turn_request_budget_bounds_refusal_fallback_cycles', 'test_turn_request_budget_includes_auto_compaction_and_its_retry', 'test_turn_request_budget_cancellation_wins_at_retry_boundary', 'test_turn_request_budget_last_slot_compaction_and_cancellation', 'test_turn_request_budget_exhaustion_preserves_partial_tool_cleanup'], 'acp-thread': ['test_turn_request_budget_stop_is_visible_and_preserves_completed_entries', 'test_turn_request_budget_stale_stop_preserves_the_current_turn'], 'settings-window': ['settings_window_cmd_w_closes_only_settings', 'settings_window_search_escape_keeps_window_and_cmd_w_closes', 'settings_window_cmd_w_closes_with_mcp_input_focused'], 'output-limit': ['test_output_limit_automatically_continues_to_end_turn', 'test_output_limit_continuation_has_consecutive_failure_cap', 'test_output_limit_waits_for_streamed_write_rollback_before_retry', 'test_output_limit_transport_retry_preserves_instruction_and_budget', 'test_output_limit_cleanup_also_rolls_back_partial_write_before_refusal', 'test_output_limit_budget_resets_after_complete_tool_batch', 'test_output_limit_completes_interrupted_nonstreaming_tool_call'], 'compaction': ['test_compaction_keeps_reference_images_outside_the_text_budget', 'test_compaction_threshold_uses_percentage_setting', 'test_compaction_threshold_accounts_for_max_output_tokens', 'test_compaction_threshold_respects_enabled_setting', 'test_compaction_threshold_respects_token_settings', 'test_compaction_unavailable_for_small_context_window', 'test_compaction_inserts_before_new_user_and_requests_compacted_window', 'test_compaction_usage_counts_toward_cumulative_usage'], 'manual-compaction-cancel': ['test_manual_compact_cancelled_leaves_no_marker'], 'acp-stale-cancel': ['test_stale_cancelled_response_does_not_cancel_current_compaction'], 'acp-max-tokens': ['test_max_tokens_cancels_pending_session_elicitation']}
          results = {}
          for line in (output / "results.tsv").read_text().splitlines():
              label, command_exit, log_exit = line.split("\t")
              if label in results:
                  raise SystemExit("Duplicate command result: " + label)
              results[label] = [int(command_exit), int(log_exit)]
          checks = {}
          passed = set(results) == set(expected) | {"default-clippy"} and all(value == [0, 0] for value in results.values())
          for label, names in expected.items():
              path = output / (label + ".log")
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", path.read_text(errors="replace")) if path.exists() else ""
              tests = re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)(?:,.*)?$", text, re.MULTILINE)
              summaries = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text, re.MULTILINE)
              found = [name.rsplit("::", 1)[-1] for name, status in tests if status == "ok"]
              valid = len(tests) == len(names) and sorted(found) == sorted(names) and summaries == [("ok", str(len(names)), "0", "0")]
              checks[label] = {"expected_names": names, "actual_tests": tests, "actual_summaries": summaries, "passed": valid}
              passed = passed and valid
          report = {"passed": bool(passed), "command_results": results, "groups": checks, "scope": "Offline default-feature mounted/model tests only; no paid service, native app, Store, GPU, or performance acceptance."}
          (output / "required-test-results.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          if not passed:
              raise SystemExit("Required release blocker tests or lint did not all pass")
          PYRESULTS

      - name: Preserve release blocker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-blocker-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-blocker-regressions
          if-no-files-found: error
          retention-days: 14

  # The only check the main ruleset requires: keep the job id and its name `gate`.
  # A draft pull request passes with only `changes` and `hygiene` having run.
  gate:
    if: ${{ always() }}
    # Every job a pull request must pass. `native-video` is manual only.
    needs: [changes, hygiene, linux-test, check, mac-app-store-runtime, release-blocker-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pass when every needed job succeeded or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # `--advisory` goes when `linux-test` loses `continue-on-error` (spec 0012, T2).
        run: script/gate --needs-json "$NEEDS_JSON" --advisory linux-test

  native-video:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_video_only }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: $/.github/actions/prepare-skia-source
        with:
          offline: 'true'
      - name: Test canvas video rendering
        id: native-library
        run: cargo test --locked -p fanta-render --lib live_video_
      - name: Test editor video playback with seek diagnostics
        env:
          FANTA_VIDEO_SEEK_TRACE: '1'
        run: cargo test --locked -p fig_viewer --lib video_playback::tests
      - name: Test editor video playback without diagnostic timing overhead
        if: ${{ !cancelled() && steps.native-library.outcome == 'success' }}
        run: cargo test --locked -p fig_viewer --lib video_playback::tests
