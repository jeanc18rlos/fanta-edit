name: Build Linux release

on:
  push:
    tags: ['v*']
  # Pull requests that change the packaging build and launch the tarball, but never sign or
  # publish it.
  pull_request:
    paths:
      - '.github/workflows/release-linux.yml'
      - 'crates/fanta/resources/fanta-mime.xml'
      - 'crates/fanta/resources/fanta.desktop.in'
      - 'script/bundle-linux'
      - 'script/install.sh'
  workflow_dispatch:
    inputs:
      signed:
        description: Sign the tarball for in-place updates (runs only from main; needs FANTA_UPDATE_SIGNING_KEY in the release environment)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  FANTA_RELEASE_CHANNEL: stable

jobs:
  build:
    name: Build x86_64 tarball
    # Binaries built here run on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/fanta/Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Release tag must match crates/fanta/Cargo.toml: v${version}"
            exit 1
          fi

      # A release build of the workspace outgrows the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux dependencies
        run: ./script/linux

      # No build cache: tag builds can restore only caches saved on main, which never runs this
      # workflow, and the repository's caches are already at GitHub's limit.
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0

      - name: Build and package Fanta
        env:
          FANTA_CLIENT_CHECKSUM_SEED: ${{ secrets.FANTA_CLIENT_CHECKSUM_SEED }}
        run: ./script/bundle-linux

      - name: Record checksum
        working-directory: target/release
        run: sha256sum fanta-linux-x86_64.tar.gz > SHA256SUMS-linux-x86_64.txt

      # Installs the tarball the way users do, then opens the sample project under Xvfb with
      # Mesa's software Vulkan, so a startup panic or a broken bundle fails the build.
      - name: Install and launch the tarball
        run: |
          sudo apt-get install -y xvfb dbus mesa-vulkan-drivers libgl1-mesa-dri libegl1 x11-utils xdotool \
            imagemagick desktop-file-utils xdg-utils rsync
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          FANTA_BUNDLE_PATH="$PWD/target/release/fanta-linux-x86_64.tar.gz" sh script/install.sh

          # The auto-updater replaces this directory and restarts libexec/fanta-editor.
          app="$HOME/.local/fanta.app"
          test -x "$app/libexec/fanta-editor"
          test -x "$HOME/.local/bin/fanta"
          if ldd "$app/libexec/fanta-editor" | grep 'not found'; then
            echo "::error::The bundled editor is missing shared libraries"
            exit 1
          fi
          "$HOME/.local/bin/fanta" --version | tee "$smoke/version.txt"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/fanta/Cargo.toml)
          if ! grep -q "^Fanta ${version} " "$smoke/version.txt"; then
            echo "::error::The command-line tool did not report the stable channel and version ${version}"
            exit 1
          fi
          desktop-file-validate "$HOME/.local/share/applications/dev.fanta.Fanta.desktop"
          for type in application/x-figma text/x-fanta-fnx; do
            handler=$(xdg-mime query default "$type")
            if [[ "$handler" != dev.fanta.Fanta.desktop ]]; then
              echo "::error::$type opens with '$handler' after install.sh, not Fanta"
              exit 1
            fi
          done

          unzip -q docs/samples/Fanta-launch-card-sample.zip -d "$smoke"
          Xvfb :99 -screen 0 1440x900x24 &
          export DISPLAY=:99
          sleep 2
          dbus-run-session -- "$app/libexec/fanta-editor" "$smoke/Fanta Launch Card" > "$smoke/editor.log" 2>&1 &
          editor=$!
          sleep 60
          import -window root "$smoke/screenshot.png"
          xwininfo -root -tree > "$smoke/windows.txt"

          # Every pan paints a new CPU frame, which stays in GPUI's sprite atlas unless the
          # canvas drops it. Software Vulkan keeps the atlas in process memory.
          window=$(xdotool search --onlyvisible --class 'dev\.fanta\.Fanta' | head -1 || true)
          if [[ -n "$window" ]] && kill -0 "$editor"; then
            # By name: dbus-run-session's command line also contains the editor's path.
            editor_pid=$(pgrep -x fanta-editor | head -1)
            resident_mb() { awk '/^VmRSS/ { print int($2 / 1024) }' "/proc/$editor_pid/status"; }
            eval "$(xdotool getwindowgeometry --shell "$window")"
            xdotool mousemove --window "$window" $((WIDTH / 2)) $((HEIGHT / 2))
            before=$(resident_mb)
            xdotool click --repeat 25 --delay 40 5
            sleep 1
            import -window root "$smoke/screenshot-panned.png"
            # ImageMagick prints the number of differing pixels and exits 1 when there are any.
            moved=$(compare -metric AE "$smoke/screenshot.png" "$smoke/screenshot-panned.png" null: 2>&1 || true)
            xdotool click --repeat 25 --delay 40 4
            for _ in 1 2; do
              xdotool click --repeat 25 --delay 40 5
              xdotool click --repeat 25 --delay 40 4
            done
            sleep 5
            after=$(resident_mb)
            echo "Editor resident memory: ${before} MB, then ${after} MB after 150 canvas pans. The first 25 pans changed ${moved} screen pixels." |
              tee -a "$GITHUB_STEP_SUMMARY" "$smoke/memory.txt"
          else
            echo "::warning::Could not find the Fanta window, so canvas memory was not measured."
          fi

          cp "$HOME/.local/share/fanta/logs/Fanta.log" "$smoke/" || echo "Fanta.log is missing"
          if ! kill -0 "$editor"; then
            wait "$editor" || echo "Fanta exited with status $?"
            cat "$smoke/editor.log"
            echo "::error::Fanta exited within a minute of launching"
            exit 1
          fi
          pkill -x fanta-editor
          if grep -n 'panicked' "$smoke/editor.log" "$smoke/Fanta.log"; then
            echo "::error::Fanta panicked during launch"
            exit 1
          fi
          if ! grep -i 'fanta' "$smoke/windows.txt"; then
            cat "$smoke/windows.txt"
            echo "::error::Fanta did not open a window"
            exit 1
          fi

      - name: Preserve launch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanta-linux-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke/*.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanta-linux-x86_64
          path: |
            target/release/fanta-linux-x86_64.tar.gz
            target/release/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload crash symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanta-symbols-linux-x86_64-${{ github.sha }}
          path: target/x86_64-unknown-linux-gnu/release/fanta.dbg
          if-no-files-found: error
          retention-days: 90

      - name: Summarize build
        run: |
          printf '### Fanta for Linux (x86_64)\n\nCommit: `%s`\n\nThe tarball and its checksum are in this run’s `fanta-linux-x86_64` artifact, and its update signature, if any, comes from the sign-update job. Crash symbols are stored separately.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Installed copies update themselves only with tarballs this key signed
  # (crates/auto_update/src/verify.rs). The key lives only in the release environment, which
  # admits main and release tags, so a branch that edits this workflow still can't reach it.
  sign-update:
    name: Sign the tarball for in-place updates
    if: startsWith(github.ref, 'refs/tags/') || inputs.signed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fanta-linux-x86_64
          path: target

      # Its own step, so no package's install code runs with the key in its environment.
      - name: Install the update signer
        run: |
          python3 -m venv "$RUNNER_TEMP/update-signing"
          "$RUNNER_TEMP/update-signing/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r script/update-signing-requirements.txt

      - name: Sign the tarball
        env:
          FANTA_UPDATE_SIGNING_KEY: ${{ secrets.FANTA_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$FANTA_UPDATE_SIGNING_KEY" ]]; then
            echo "::warning::FANTA_UPDATE_SIGNING_KEY is not set in the release environment, so this tarball is unsigned and installed copies will not update to it."
            exit 0
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/fanta/Cargo.toml)
          "$RUNNER_TEMP/update-signing/bin/python" script/update_signing.py sign \
            --asset fanta-linux-x86_64.tar.gz --version "$version" \
            --file target/fanta-linux-x86_64.tar.gz \
            --public-key-file crates/auto_update/release-signing-key.pub \
            > target/fanta-linux-x86_64.tar.gz.sig
          echo 'The tarball is signed for in-place updates.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the update signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanta-linux-x86_64-update-signature
          path: target/fanta-linux-x86_64.tar.gz.sig
          if-no-files-found: ignore
          retention-days: 30

  draft-release:
    name: Add to the draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, sign-update]
    runs-on: ubuntu-latest
    # Each platform's release workflow uses this group, so they add to one draft in turn.
    concurrency:
      group: draft-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The tarball, plus its update signature when sign-update produced one.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fanta-linux-x86_64*
          merge-multiple: true
          path: release

      - name: Upload the tarball to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release/fanta-linux-x86_64.tar.gz release/SHA256SUMS-linux-x86_64.txt)
          # The .sig is what installed copies check before updating in place.
          if [[ -s release/fanta-linux-x86_64.tar.gz.sig ]]; then
            assets+=(release/fanta-linux-x86_64.tar.gz.sig)
          else
            echo "::warning::The tarball is unsigned, so installed copies will not update to it."
            # A signature from an earlier upload would not match this tarball.
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx 'fanta-linux-x86_64.tar.gz.sig'; then
              gh release delete-asset "$GITHUB_REF_NAME" fanta-linux-x86_64.tar.gz.sig --yes
            fi
          fi
          script/upload-draft-release "$GITHUB_REF_NAME" "${assets[@]}"
