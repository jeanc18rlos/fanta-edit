[package]
name = "fanta-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Rich text model + Skia paragraph layout + font resolution (bundled faces, metric-compatible substitution, optional Google Fonts fetch)."

[features]
default = ["native-fonts"]
native-fonts = ["dep:ureq", "dep:dirs", "dep:zip"]

[dependencies]
fanta-doc.workspace = true
thiserror.workspace = true
tracing.workspace = true
skia-safe.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
# Best-effort, offline-safe HTTP fetch of OFL fonts from Google Fonts at
# runtime (see `font_resolver`). Blocking + tiny; pure-Rust rustls TLS with
# bundled webpki roots so there's no system-cert dependency. A timeout keeps a
# missing/slow network from stalling layout; failures fall through to the next
# resolution step rather than panicking.

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ureq = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
# JSON round-trip tests for the serde-derived style types. Matches fanta-doc's
# test setup; not a runtime dependency of the engine.
serde_json.workspace = true

[lints]
workspace = true
