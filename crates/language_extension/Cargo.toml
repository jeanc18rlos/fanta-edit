[package]
name = "language_extension"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/language_extension.rs"

[features]
# Fanta ships without tree-sitter's wasm runtime, so the loader that would parse
# extension-provided grammars is compiled out. Kept as a feature so re-enabling
# `language/wasm-grammars` restores registration rather than needing a code change.
wasm-grammars = ["language/wasm-grammars"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
collections.workspace = true
extension.workspace = true
futures.workspace = true
fs.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
util.workspace = true
ztracing.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]
