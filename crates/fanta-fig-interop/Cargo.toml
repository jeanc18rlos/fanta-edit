[package]
name = "fanta-fig-interop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = ".fig import — Kiwi codec port from OpenPencil #1. Phase 4."

[dependencies]
fanta-doc.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Stash the originating Figma node type (INSTANCE/COMPONENT/...) in each node's
# opaque `meta` (a `serde_json::Value`) so downstream tools can tell a component
# instance from a plain group without re-parsing the file.
serde_json.workspace = true
# Raw DEFLATE for the `.fig` schema chunk. (Verified against a real Figma
# export: the schema chunk is *raw* deflate, no zlib wrapper.)
flate2.workspace = true
# Modern Figma `.fig` files are a ZIP archive whose `canvas.fig` entry holds
# the fig-kiwi stream, alongside `images/`, `thumbnail.png`, `meta.json`.
# Same major as fanta-format uses, so it's already in the lock.
zip.workspace = true
# The fig-kiwi *data* chunk is Zstandard-compressed in current Figma exports
# (the schema chunk stays raw DEFLATE). C-backed zstd for speed — the data
# chunk decompresses to tens of MB and the build already links C (skia).
zstd.workspace = true

[dev-dependencies]
# Tier-2 fidelity E2E only: derive `Deserialize` for the distilled OpenPencil
# golden model. `serde_json` (a runtime dep) does the parsing.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
