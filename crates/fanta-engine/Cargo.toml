[package]
name = "fanta-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "The cloud engine worker: runs design steps (inspect, edit, comment, render, changeset) on a Fanta project without the app."

[lib]
path = "src/fanta_engine.rs"
doctest = false

[[bin]]
name = "fanta-engine"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
fanta-api.workspace = true
fanta-design-ops.workspace = true
fanta-doc.workspace = true
fanta-headless.workspace = true
flate2.workspace = true
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync"] }
ureq.workspace = true

[dev-dependencies]
fanta-format.workspace = true
tiny_http.workspace = true

[lints]
workspace = true
