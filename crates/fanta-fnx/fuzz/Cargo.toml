[package]
name = "fanta-fnx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace: libfuzzer-sys and the nightly toolchain stay out of the
# root workspace and its Cargo.lock.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
fanta-fnx = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
