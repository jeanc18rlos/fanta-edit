[package]
name = "fanta-fnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The .fnx design-as-source language: lossless React/JSX-style text <-> the doc's per-node JSON projection, with an id sidecar."

[dependencies]
# The whole codec operates on serde_json::Value (the doc's canonical per-node
# projection), so fanta-fnx stays free of the doc model and is a pure language
# crate reusable by persistence (fanta-format) and views (fanta-app/export).
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's default number parser is only accurate to
# within 1 ULP, so re-reading a printed `.fnx` moved floats that need all 17
# significant digits (`21.762165069580078` came back as `21.76216506958008`)
# and the next save rewrote every line it touched. A design-as-source file has
# to survive text -> memory -> text byte-identically, which is exactly what
# this feature buys.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
# Test-only: prove the codec round-trips REAL serialized `CanvasNode`s (the
# actual transform/flatten/SmallVec/flags shapes), not just hand-written JSON.
# This is a dev dep only — the crate itself stays model-agnostic.
fanta-doc.workspace = true

[lints]
workspace = true
