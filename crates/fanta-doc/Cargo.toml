[package]
name = "fanta-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Polymorphic scene graph, CanvasNode enum, undo/redo, selection. Renderer-agnostic."

[dependencies]
# Identity. ULID is globally unique, lexicographically sortable by time, and
# CRDT-friendly — multiple peers can mint IDs without coordination.
ulid.workspace = true

# Math. f64 in the doc; f32 projection happens at render time (see ARCHITECTURE.md §13).
glam.workspace = true

# Pure-geometry 2D curve/stroke math (no renderer): bakes a stroke into a filled
# outline path (`PathData::stroke_to_fill`) so an icon authored as strokes becomes
# a robust filled vector. Renderer-agnostic, in the spirit of `glam`.
kurbo.workspace = true

# Serialization. The canonical `.fant.json` projection is what AI reads and writes.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Containers. SmallVec for short inline lists (selection, small children lists);
# bitflags for flag fields.
smallvec = { workspace = true, features = ["serde"] }
bitflags = { workspace = true, features = ["serde"] }

# Workspace shared.
thiserror.workspace = true

# Clock that re-exports std on native and uses the JS clock on browser wasm,
# where std's SystemTime panics. ulid already uses it internally.
web-time.workspace = true

# ulid mints ids through getrandom, whose browser backend must be chosen by
# the top-level build: this activates it whenever the doc model compiles to
# wasm (builds also pass RUSTFLAGS --cfg getrandom_backend="wasm_js").
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
