[package]
description = "Fanta - an agent-native design app"
edition.workspace = true
name = "zed"
version = "0.1.0-alpha.1"
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["Fanta"]
default-run = "fanta"

[lints]
workspace = true

[features]
fanta-gpui-ui = ["fig_viewer/fanta-gpui-ui"]
tracy = ["ztracing/tracy"]
# LEAK_BACKTRACE=1 cargo run --features zed/track-project-leak --profile release-fast
track-project-leak = ["gpui/leak-detection"]

[[bin]]
name = "fanta"
path = "src/main.rs"

[dependencies]
acp_tools.workspace = true
agent.workspace = true
agent_settings.workspace = true
agent_ui = { workspace = true, features = ["audio"] }
anyhow.workspace = true
askpass.workspace = true
assets.workspace = true
audio.workspace = true
auto_update.workspace = true
breadcrumbs.workspace = true
chrono.workspace = true
channel.workspace = true
clap.workspace = true
cli.workspace = true
client.workspace = true
collections.workspace = true
command_palette.workspace = true
command_palette_hooks.workspace = true
component.workspace = true
crashes.workspace = true
db.workspace = true
editor.workspace = true
feature_flags.workspace = true
fig_viewer.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
git_hosting_providers.workspace = true
git_ui.workspace = true
system_specs.workspace = true
gpui = { workspace = true, features = ["input-latency-histogram"] }
gpui_platform = { workspace = true, features = ["font-kit"] }
hdrhistogram.workspace = true
itertools.workspace = true
semver.workspace = true
gpui_tokio.workspace = true
rayon.workspace = true

http_client.workspace = true
image_viewer.workspace = true
input_latency_ui.workspace = true
install_cli.workspace = true
language.workspace = true
language_model.workspace = true
language_models.workspace = true
fanta_languages.workspace = true
libc.workspace = true
log.workspace = true
markdown.workspace = true
menu.workspace = true
migrator.workspace = true
mimalloc = { version = "0.1", optional = true }
node_runtime.workspace = true
notifications.workspace = true
parking_lot.workspace = true
paths.workspace = true
profiling.workspace = true
project.workspace = true
prompt_store.workspace = true
proto.workspace = true
recent_projects.workspace = true
release_channel.workspace = true
remote.workspace = true
reqwest.workspace = true
reqwest_client.workspace = true
rope.workspace = true
sandbox.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
session.workspace = true
settings.workspace = true
shellexpand.workspace = true
sidebar.workspace = true
smol.workspace = true
snippet_provider.workspace = true
sysinfo.workspace = true
task.workspace = true
telemetry.workspace = true
telemetry_events.workspace = true
terminal_view.workspace = true
theme.workspace = true
theme_settings.workspace = true
theme_selector.workspace = true
time.workspace = true
time_format.workspace = true
title_bar.workspace = true
ztracing.workspace = true
tracing.workspace = true
ui.workspace = true
ui_prompt.workspace = true
url.workspace = true
urlencoding.workspace = true
util.workspace = true
uuid.workspace = true
vim_mode_setting.workspace = true
watch.workspace = true
web_search.workspace = true
web_search_providers.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zed_env_vars.workspace = true
zlog.workspace = true
zlog_settings.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
etw_tracing.workspace = true
windows.workspace = true
gpui = { workspace = true, features = [
    "input-latency-histogram",
    "windows-manifest",
] }

[build-dependencies]
windows_resources = { path = "../windows_resources" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { workspace = true, features = [
    "input-latency-histogram",
    "wayland",
    "x11",
] }
ashpd.workspace = true
image.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.build-dependencies]
image.workspace = true


[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"

[package.metadata.bundle-dev]
category = "public.app-category.graphics-design"
copyright = "Copyright 2026 Fanta"
icon = ["resources/app-icon-dev@2x.png", "resources/app-icon-dev.png"]
identifier = "dev.fanta.Fanta-Dev"
name = "Fanta Dev"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["fanta"]

[package.metadata.bundle-nightly]
category = "public.app-category.graphics-design"
copyright = "Copyright 2026 Fanta"
icon = ["resources/app-icon-nightly@2x.png", "resources/app-icon-nightly.png"]
identifier = "dev.fanta.Fanta-Nightly"
name = "Fanta Nightly"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["fanta"]

[package.metadata.bundle-preview]
category = "public.app-category.graphics-design"
copyright = "Copyright 2026 Fanta"
icon = ["resources/app-icon-preview@2x.png", "resources/app-icon-preview.png"]
identifier = "dev.fanta.Fanta-Preview"
name = "Fanta Preview"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["fanta"]

[package.metadata.bundle-stable]
category = "public.app-category.graphics-design"
copyright = "Copyright 2026 Fanta"
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]
identifier = "dev.fanta.Fanta"
name = "Fanta"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["fanta"]

[package.metadata.cargo-machete]
ignored = ["profiling", "zstd", "tracing"]
