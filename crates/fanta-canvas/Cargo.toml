[package]
name = "fanta-canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Viewport (pan/zoom), hit testing, snapping, alignment, distribution."

[dependencies]
fanta-doc.workspace = true

# Pure math layer. f64 vectors; no rendering deps.
glam.workspace = true
serde = { version = "1", features = ["derive"] }
smallvec = { workspace = true, features = ["serde", "union"] }
bitflags = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
