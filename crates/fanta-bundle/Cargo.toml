[package]
name = "fanta-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Runtime bundles: the parser-free program format fanta-runtime loads, written by fanta-compile and fanta-site."

[lib]
path = "src/bundle.rs"

[dependencies]
fanta-doc.workspace = true
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` for the same reason as fanta-doc: the document inside a
# bundle must reload to the exact floats it was written from, or a bundle
# rebuilt from a loaded program is not byte-identical to its source.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror.workspace = true
# `deflate-flate2` alone: the `deflate` umbrella also links zopfli, an encoder
# the runtime never uses.
zip = { version = "2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# sha2 0.10 selects its runtime-detected ARM SHA instructions only with `asm`.
sha2 = { version = "0.10", features = ["asm"] }

[lints]
workspace = true
