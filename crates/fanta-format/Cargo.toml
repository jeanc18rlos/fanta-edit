[package]
name = "fanta-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = ".fant zip container (JSON doc + content-addressed assets), git-native .fnx project tree, schema migrations."

[dependencies]
# Doc model — the thing we serialize and load.
fanta-doc.workspace = true

# The `.fnx` design-as-source codec — the per-page/per-component node encoding.
fanta-fnx.workspace = true

# Error and logging primitives shared across the workspace.
thiserror.workspace = true
tracing.workspace = true

# Container format. `.fant` files are zip archives; this is the canonical Rust
# crate for reading and writing them with broad codec support.
zip.workspace = true

# JSON manifest + canonical doc projection. `serde_json::Value` is also used as
# the typed seam for schema migrations so older docs can be transformed in
# place without needing a versioned Rust type per release.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` for the same reason as fanta-fnx: the projected JSON files
# (`doc/metadata.json`, `pages/*/page.json`, variables, …) must reload to the
# exact floats they were written from, or every save rewrites them.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Content-addressing for assets. SHA-256 is overkill for raw dedup but gives us
# a 128-bit truncation we can fold into `AssetId::from_u128` without collisions
# in any realistic project.
sha2 = "0.10"

# Source-buffer edits are persisted through a same-directory temporary file so
# an interrupted write cannot leave the project's readable source truncated.
tempfile = "3"

[dev-dependencies]
# Tests create real .fant files on disk so the round-trip surface is the real
# zip-on-filesystem behaviour, not an in-memory fake.
tempfile = "3"
# Integration tests read the `.fnx` id sidecars to verify the v2 layout.
serde_json = "1"
fanta-fnx.workspace = true

[lints]
workspace = true
