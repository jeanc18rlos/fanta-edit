[package]
name = "fanta-wasm-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "The design engine compiled to browser WebAssembly: load a project's files, apply design ops, emit the saved files (spec 0008 T1)."

[lib]
path = "src/fanta_wasm_engine.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anyhow.workspace = true
fanta-design-ops.workspace = true
fanta-doc.workspace = true
# Path form: a workspace dependency cannot drop default features, and this
# build must leave out the disk writers and the Skia renderer.
fanta-format = { path = "../fanta-format", default-features = false }
fanta-headless = { path = "../fanta-headless", default-features = false }
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
