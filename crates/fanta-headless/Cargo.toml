[package]
name = "fanta-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Fanta's design engine without the app: open, edit, render and save a project directory."

[lib]
path = "src/fanta_headless.rs"
doctest = false

[features]
default = ["native", "render"]
# Disk project I/O: open and save a project directory (HeadlessProject).
native = ["render", "fanta-format/native"]
# CPU rendering, screenshots and export through Skia; off in the browser
# wasm engine build, where the document edits without drawing.
render = ["dep:fanta-render", "dep:skia-safe"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
fanta-canvas.workspace = true
fanta-design-ops.workspace = true
fanta-doc.workspace = true
fanta-fnx.workspace = true
# Path form: a workspace dependency cannot drop default features, and the
# wasm engine build needs fanta-format without its native half.
fanta-format = { path = "../fanta-format", default-features = false }
fanta-render = { workspace = true, optional = true }
glam.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skia-safe = { workspace = true, optional = true }
smallvec.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
