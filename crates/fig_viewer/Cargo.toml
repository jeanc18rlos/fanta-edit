[package]
name = "fig_viewer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/fig_viewer.rs"
doctest = false

[dependencies]
anyhow.workspace = true
editor.workspace = true
fanta-canvas.workspace = true
fanta-doc.workspace = true
fanta-fig-interop.workspace = true
fanta-format.workspace = true
fanta-render.workspace = true
fanta-text.workspace = true
fanta-tools.workspace = true
file_icons.workspace = true
fs.workspace = true
glam.workspace = true
gpui.workspace = true
image.workspace = true
language.workspace = true
log.workspace = true
project.workspace = true
settings.workspace = true
smallvec.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
worktree.workspace = true

[dev-dependencies]
assets.workspace = true
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
semver.workspace = true
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
# `project/test-support` above turns on `remote/test-support`, which makes the
# `RemoteConnectionIdentity::Mock` variant visible; without `workspace`'s own
# `test-support` the match arm handling it is cfg'd out and the crate fails to
# compile. Keep the two in sync so the fig_viewer test binary links.
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-video.workspace = true
foreign-types = "0.5"
metal.workspace = true
skia-safe.workspace = true
