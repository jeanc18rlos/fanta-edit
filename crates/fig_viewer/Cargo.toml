[package]
name = "fig_viewer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/fig_viewer.rs"
doctest = false

[features]
# The fanta-gpui LayersPanel is the only layers UI, so the runtime is on by
# default; `--no-default-features` builds a diagnostic host without it.
default = ["fanta-gpui-ui"]
fanta-gpui-ui = ["dep:fanta-gpui", "dep:gpui-component"]

[[example]]
name = "fanta_gpui_smoke"
required-features = ["fanta-gpui-ui"]

[dependencies]
fanta-gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
anyhow.workspace = true
agent_ui.workspace = true
base64.workspace = true
context_server.workspace = true
design_surface.workspace = true
editor.workspace = true
fanta-canvas.workspace = true
fanta-doc.workspace = true
fanta-fig-interop.workspace = true
fanta-format.workspace = true
fanta-present.workspace = true
fanta-render.workspace = true
fanta-text.workspace = true
fanta-tools.workspace = true
fanta_ui.workspace = true
file_icons.workspace = true
fs.workspace = true
glam.workspace = true
gpui.workspace = true
image.workspace = true
language.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
skia-safe.workspace = true
smallvec.workspace = true
tempfile.workspace = true
theme.workspace = true
ui.workspace = true
url.workspace = true
util.workspace = true
workspace.workspace = true
worktree.workspace = true

[dev-dependencies]
gpui_platform = { workspace = true, default-features = true }
assets.workspace = true
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
remote_connection = { workspace = true, features = ["test-support"] }
semver.workspace = true
settings = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
# `project/test-support` turns on `remote/test-support`, which exposes its Mock
# variants. Keep every direct consumer's matching test support enabled too.
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-video.workspace = true
foreign-types = "0.5"
metal.workspace = true
skia-safe = { workspace = true, features = ["metal"] }
