<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanta motion preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f6f4ef; font: 12px system-ui, sans-serif; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #controls { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  #controls button { min-width: 64px; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: inherit; cursor: pointer; }
  #controls input { flex: 1; }
  #clock { font-variant-numeric: tabular-nums; }
  .fanta-box { position: absolute; left: 0; top: 0; pointer-events: none; }
  .fanta-image { position: absolute; max-width: none; }
  html.render #shell { display: block; }
  html.render [data-export-hide] { display: none !important; }
</style>
</head>
<body>
<div id="shell">
  <div id="viewport"><div id="frame"><div id="stage"></div></div></div>
  <div id="controls" data-export-hide>
    <button id="toggle" type="button">Pause</button>
    <input id="scrubber" type="range" min="0" step="0.001" value="0" aria-label="Playhead">
    <span id="clock"></span>
  </div>
</div>
<script src="scene.js"></script>
<script>
(function () {
  'use strict';
  const fanta = window.FantaScene;
  const scene = fanta.scene;
  const duration = fanta.stageDuration;
  const renderMode = (function () {
    try {
      return new URLSearchParams(window.location.search).has('__render') || window.__RENDER_MODE === true;
    } catch (error) {
      return false;
    }
  })();

  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const viewport = document.getElementById('viewport');
  const toggle = document.getElementById('toggle');
  const scrubber = document.getElementById('scrubber');
  const clock = document.getElementById('clock');

  function box(element, width, height) {
    element.className = 'fanta-box';
    element.style.width = width + 'px';
    element.style.height = height + 'px';
    return element;
  }

  function image(source, name) {
    const element = document.createElement('img');
    element.className = 'fanta-image';
    element.src = source.src;
    element.alt = name;
    element.draggable = false;
    element.style.left = source.box[0] + 'px';
    element.style.top = source.box[1] + 'px';
    element.style.width = source.box[2] + 'px';
    element.style.height = source.box[3] + 'px';
    return element;
  }

  stage.style.position = 'relative';
  stage.style.width = scene.width + 'px';
  stage.style.height = scene.height + 'px';
  stage.style.overflow = 'hidden';
  stage.style.background = scene.backdrop || 'transparent';
  stage.appendChild(image(scene.background, ''));

  const elements = [];
  function mount(index, parent) {
    const layer = scene.layers[index];
    const element = box(document.createElement('div'), scene.width, scene.height);
    element.style.transformOrigin = '0 0';
    if (layer.blend) element.style.mixBlendMode = layer.blend;
    if (layer.image) element.appendChild(image(layer.image, layer.name));
    let outer = element;
    for (let clip = layer.clips.length - 1; clip >= 0; clip -= 1) {
      const wrapper = box(document.createElement('div'), scene.width, scene.height);
      wrapper.style.clipPath = "path('" + layer.clips[clip] + "')";
      wrapper.appendChild(outer);
      outer = wrapper;
    }
    parent.appendChild(outer);
    elements[index] = element;
    fanta.childrenOf(index).forEach(function (child) {
      mount(child, element);
    });
  }
  fanta.roots().forEach(function (index) {
    mount(index, stage);
  });

  let time = 0;
  function draw(seconds) {
    time = Math.min(duration, Math.max(0, Number(seconds) || 0));
    fanta.stateAt(time).forEach(function (state, index) {
      const element = elements[index];
      if (!element) return;
      element.style.transform = state.transform;
      element.style.opacity = String(state.opacity);
      element.style.display = state.visible ? 'block' : 'none';
    });
    scrubber.value = String(time);
    clock.textContent = time.toFixed(2) + ' / ' + duration.toFixed(2) + ' s';
  }

  window.__videoMeta = { width: scene.width, height: scene.height, duration: duration, fps: scene.fps };
  window.__seek = draw;

  if (renderMode) {
    document.documentElement.classList.add('render');
    stage.style.position = 'absolute';
    stage.style.left = '0';
    stage.style.top = '0';
    draw(0);
    window.__ready = true;
    return;
  }

  function fit() {
    const scale = Math.max(0.05, Math.min(viewport.clientWidth / scene.width, viewport.clientHeight / scene.height));
    frame.style.width = scene.width * scale + 'px';
    frame.style.height = scene.height * scale + 'px';
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.transformOrigin = '0 0';
  }
  window.addEventListener('resize', fit);
  fit();

  scrubber.max = String(duration);
  let playing = true;
  let previous = null;
  function step(now) {
    if (!playing) {
      previous = null;
      return;
    }
    if (previous !== null) {
      let next = time + (now - previous) / 1000;
      if (next >= duration) {
        if (scene.loop === 'once' || duration <= 0) {
          next = duration;
          playing = false;
          toggle.textContent = 'Play';
        } else {
          next = next % duration;
        }
      }
      draw(next);
    }
    previous = now;
    if (playing) requestAnimationFrame(step);
  }
  toggle.addEventListener('click', function () {
    playing = !playing;
    toggle.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      if (time >= duration) draw(0);
      previous = null;
      requestAnimationFrame(step);
    }
  });
  scrubber.addEventListener('input', function () {
    draw(Number(scrubber.value));
  });
  draw(0);
  window.__ready = true;
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
