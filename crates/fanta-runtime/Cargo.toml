[package]
name = "fanta-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Fanta's portable playback runtime: compiles project sources into runtime programs and plays them natively, over a C JSON bridge or as WebAssembly."

[lib]
path = "src/runtime.rs"

[[bin]]
name = "fanta-runtime-wasm"
path = "src/wasm.rs"

[dependencies]
fanta-doc.workspace = true
fanta-format = { path = "../fanta-format", default-features = false }
fanta-present.workspace = true
fanta-render.workspace = true
fanta-text.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "emscripten")'.dependencies]
skia-safe = { workspace = true, features = ["gl"] }

[lints]
workspace = true
