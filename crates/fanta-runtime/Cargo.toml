[package]
name = "fanta-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/runtime.rs"

[[bin]]
name = "fanta-runtime-wasm"
path = "src/wasm.rs"

[dependencies]
fanta-bundle.workspace = true
fanta-doc.workspace = true
fanta-present.workspace = true
fanta-render.workspace = true
fanta-text.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The source compiler stays out of the runtime: tests and the parity fixture
# compile fixtures natively, then load the bundle like any host would.
[dev-dependencies]
base64.workspace = true
fanta-format.workspace = true

[target.'cfg(target_os = "emscripten")'.dependencies]
skia-safe = { workspace = true, features = ["gl"] }

[lints]
workspace = true
