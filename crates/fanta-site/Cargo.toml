[package]
name = "fanta-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Project export for the web: fanta-compile writes the runtime bundle fanta-runtime loads, and fanta-site wraps it in a static website with one read-only page per design page."

[lib]
path = "src/site.rs"

[[bin]]
name = "fanta-site"
path = "src/main.rs"

[[bin]]
name = "fanta-compile"
path = "src/compile_main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fanta-doc.workspace = true
fanta-format.workspace = true
fanta-runtime.workspace = true
fanta-text.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
