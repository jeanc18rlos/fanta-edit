[package]
name = "fanta-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Static website export: a read-only page per design page, rendered in the browser by the @fanta/runtime WASM engine."

[lib]
path = "src/site.rs"

[[bin]]
name = "fanta-site"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
