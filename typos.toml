[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/",

    # Fuzz seeds are parser inputs, binary ones included.
    "crates/*/fuzz/seeds/",

    # Contributor names aren't typos.
    ".mailmap",

    # Vendored JSON schemas from SchemaStore.
    "crates/json_schema_store/src/schemas/",

    # Editor, file finder, and fuzzy matching rely on partial typing and custom in-string syntax.
    "crates/fuzzy_nucleo/src/strings.rs",
    "crates/editor/src/editor_tests.rs",
    "crates/editor/src/edit_prediction_tests.rs",
    # There are some names in the test data that are incorrectly flagged as typos.
    "crates/git/test_data/blame_incremental_complex",
    "crates/git/test_data/golden/blame_incremental_complex.json",
    # We have some base64-encoded data that is incorrectly being flagged.
    "crates/rpc/src/auth.rs",
    # File type extensions are not typos
    "crates/fanta/resources/windows/fanta.iss",
    # typos-cli doesn't understand our `vˇariable` markup
    "crates/editor/src/hover_links.rs",
    # typos-cli doesn't understand `setis` is intentional test case
    "crates/editor/src/code_completion_tests.rs",
    # Linux repository structure is not a valid text, hence we should not check it for typos
    "crates/project_panel/benches/linux_repo_snapshot.txt",
    # Some multibuffer test cases have word fragments that register as typos
    "crates/multi_buffer/src/multi_buffer_tests.rs",
    # Tests contain `baˇr` that cause `"ba" should be "by" or "be".`-like false-positives
    "crates/editor/src/document_symbols.rs",
    # Inherited test data: `GHIzJ` is a buffer fragment.
    "crates/text/src/tests.rs",
    # Vendored upstream package, kept byte-for-byte (see its FANTA-PROVENANCE.txt).
    "vendor/",
    # Golden output of a real .fig import; its text is the designer's.
    "crates/fanta-fig-interop/tests/golden/",
]

[default]
extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    'cl\[ist]',
    '\[lan\]guage',
    '"ba"',
    "doas",
    # ProtoLS crate with tree-sitter Protobuf grammar.
    "protols",
    # x11rb SelectionNotifyEvent struct field
    "requestor",
    # macOS version
    "Big Sur",
    # Not an actual typo but an intentionally invalid color, in `color_extractor`
    "#fof",
    # Stripped version of reserved keyword `type`
    "typ",
    # AMD GPU Services
    "ags",
    # AMD GPU Services
    "AGS",
    # "noet" is a vim variable (ideally to ignore locally)
    "noet",
    # Yarn Plug'n'Play
    "PnP",
    # `image` crate method: Delay::from_numer_denom_ms
    "numer",
    # Abbreviation for foreignObject in mermaid SVG processing
    "fo",
    # Mermaid CSS class name for state diagram composites
    "composit",
    # ULIDs: persisted node, component and mode ids
    '[0-9A-HJKMNP-TV-Z]{26}',
    # Plurals of .fig node kinds in prose: FRAMEs, BOOLEAN_OPERATIONs
    '\b[A-Z][A-Z_]+s\b',
    # Intra-doc link followed by a suffix: [`Align`]ment
    '`\]ment',
]
check-filename = true

[default.extend-words]
# OpenType width axis tag
wdth = "wdth"
# Level of detail (mipmaps)
lod = "lod"
LOD = "LOD"
# MP4 track atom
trak = "trak"
# Media element state; also in a test name CI requires by exact name
seeked = "seeked"
# App Store Connect error code prefix (ITMS-90869)
ITMS = "ITMS"
# The `mis-` prefix: mis-route, mis-resolve
mis = "mis"
# Deliberate misspellings that exercise the "did you mean" diagnostics
Buton = "Buton"
raduis = "raduis"
# Expected slug of "Café" once the accent is dropped
caf = "caf"
# Local names: ancestor, parent node, bounds or alpha of b, incoming y
anc = "anc"
pn = "pn"
ba = "ba"
iy = "iy"
# Accepted variant spelling in an inherited Zed comment
writeable = "writeable"

[default.extend-identifiers]
# Possessives in test names: "child's", "box's"
unclipped_ancestor_does_not_cull_an_offscreen_childs_visible_shadow = "unclipped_ancestor_does_not_cull_an_offscreen_childs_visible_shadow"
a_rotated_group_keeps_its_size_and_reports_its_boxs_world_corner = "a_rotated_group_keeps_its_size_and_reports_its_boxs_world_corner"
